<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa7bd"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker><marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/></marker></defs>
<style>.bt{font:600 19px -apple-system,Helvetica,Arial,sans-serif;fill:#eef1f4} .bs{font:15px -apple-system,Helvetica,Arial,sans-serif;fill:#9aa7bd} .al{font:14px -apple-system,Helvetica,Arial,sans-serif;fill:#b7c1d3} .who{font:600 13px -apple-system,Helvetica,Arial,sans-serif;letter-spacing:.04em}</style>
<rect width="100%" height="100%" fill="#0a1226"/>

<!-- dispatch -->
<rect x="370" y="20" width="360" height="52" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="370" y="20" width="6" height="52" rx="3" fill="#ffb81c"/>
<text x="392" y="51" class="bt">One human message</text><text x="710" y="51" class="who" text-anchor="end" fill="#ffb81c">DISPATCH</text>
<path d="M550,72 L550,108" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>

<!-- 1 requirements -->
<rect x="300" y="110" width="500" height="72" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="300" y="110" width="6" height="72" rx="3" fill="#58a6ff"/>
<text x="322" y="140" class="bt">1 · Requirements analysis</text><text x="780" y="140" class="who" text-anchor="end" fill="#58a6ff">ARCHITECT</text>
<text x="322" y="164" class="bs">the whole spec becomes acceptance criteria (the checklist)</text>

<!-- 2 handoff -->
<path d="M550,182 L550,218" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<rect x="300" y="220" width="500" height="90" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="300" y="220" width="6" height="90" rx="3" fill="#ffb81c"/>
<text x="322" y="250" class="bt">2 · Handoff</text><text x="780" y="250" class="who" text-anchor="end" fill="#ffb81c">ALL THREE</text>
<text x="322" y="274" class="bs">the Architect sends one brief to both: task, spec, checklist</text>
<text x="322" y="296" class="bs">the Implementer and the Verifier start from the same page</text>
<path d="M460,310 L460,336 L280,336 L280,368" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<path d="M640,310 L640,336 L820,336 L820,368" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>

<!-- row A -->
<rect x="80" y="370" width="400" height="90" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="80" y="370" width="6" height="90" rx="3" fill="#34d399"/>
<text x="102" y="400" class="bt">3 · Development</text><text x="460" y="400" class="who" text-anchor="end" fill="#34d399">IMPLEMENTER</text>
<text x="102" y="424" class="bs">builds on the last accepted stage,</text>
<text x="102" y="446" class="bs">from the brief and the checklist</text>
<rect x="620" y="370" width="400" height="90" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="620" y="370" width="6" height="90" rx="3" fill="#a78bfa"/>
<text x="642" y="400" class="bt">3 · Test design</text><text x="1000" y="400" class="who" text-anchor="end" fill="#a78bfa">VERIFIER</text>
<text x="642" y="424" class="bs">writes its own tests from the spec</text>
<text x="642" y="446" class="bs">black-box: without seeing the code</text>
<path d="M280,460 L280,568" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<path d="M820,460 L820,478" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<!-- verifier waits -->
<rect x="660" y="480" width="320" height="58" rx="29" fill="#0f1930" stroke="#5b6a85" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="820" y="504" class="bt" text-anchor="middle" style="font-size:16px">Verifier waits</text>
<text x="820" y="526" class="al" text-anchor="middle">for one exact version</text>
<path d="M820,538 L820,568" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<!-- row B -->
<rect x="80" y="570" width="400" height="90" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="80" y="570" width="6" height="90" rx="3" fill="#34d399"/>
<text x="102" y="600" class="bt">4 · Developer testing</text><text x="460" y="600" class="who" text-anchor="end" fill="#34d399">IMPLEMENTER</text>
<text x="102" y="624" class="bs">runs its own unit tests, then checks</text>
<text x="102" y="646" class="bs">its work line by line against the checklist</text>
<rect x="620" y="570" width="400" height="90" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="620" y="570" width="6" height="90" rx="3" fill="#a78bfa"/>
<text x="642" y="600" class="bt">5 · Independent QA</text><text x="1000" y="600" class="who" text-anchor="end" fill="#a78bfa">VERIFIER</text>
<text x="642" y="624" class="bs">clean build, supplied checks, own tests,</text>
<text x="642" y="646" class="bs">on that exact version; code read as a note</text>
<path d="M480,615 L618,615" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<text x="549" y="605" class="al" text-anchor="middle">release candidate</text>
<text x="549" y="636" class="al" text-anchor="middle">one exact version</text>
<!-- row C -->
<rect x="80" y="700" width="400" height="90" rx="10" fill="#111c33" stroke="#2a3a58" stroke-width="1.5"/><rect x="80" y="700" width="6" height="90" rx="3" fill="#ff6b6b"/>
<text x="102" y="730" class="bt">7 · Fix, retest, regression</text><text x="460" y="730" class="who" text-anchor="end" fill="#34d399">IMPLEMENTER</text>
<text x="102" y="754" class="bs">fixes the root cause, not one example;</text>
<text x="102" y="776" class="bs">retest: still broken, BLOCK at once</text>
<path d="M280,700 L280,662" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<text x="292" y="686" class="al" text-anchor="start">new version</text>
<!-- verdict to gate -->
<path d="M820,660 L820,808" fill="none" stroke="#9aa7bd" stroke-width="2" marker-end="url(#a)"/>
<text x="808" y="730" class="al" text-anchor="end" style="font-weight:600">verdict, to the Architect</text>
<text x="808" y="748" class="al" text-anchor="end" style="font-weight:600">and the Implementer</text>
<!-- 8 release gate decision -->
<polygon points="820,810 960,875 820,940 680,875" fill="#111c33" stroke="#58a6ff" stroke-width="2.5"/>
<text x="820" y="872" class="bt" text-anchor="middle">8 · Release gate</text>
<text x="820" y="894" class="who" text-anchor="middle" fill="#58a6ff">ARCHITECT</text>
<path d="M680,875 L482,875" fill="none" stroke="#ff6b6b" stroke-width="2" marker-end="url(#r)"/>
<text x="581" y="866" class="al" text-anchor="middle" style="fill:#ff6b6b;font-weight:600">BLOCK, fix rounds 1–4</text>
<text x="581" y="894" class="al" text-anchor="middle" style="fill:#ff6b6b">send back for a fix</text>
<path d="M960,875 L1058,875" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#r)"/>
<text x="1009" y="866" class="al" text-anchor="middle" style="fill:#ff6b6b;font-weight:600">5th BLOCK</text>
<path d="M890,842 L960,842 L960,662" fill="none" stroke="#9aa7bd" stroke-width="2" stroke-dasharray="3 4" marker-end="url(#a)"/>
<text x="972" y="730" class="al" style="font-weight:600">INCONCLUSIVE, or a PASS</text>
<text x="972" y="748" class="al" style="font-weight:600">that is not valid:</text>
<text x="972" y="766" class="al">back for a new verdict</text>
<path d="M820,940 L820,962" fill="none" stroke="#3fb950" stroke-width="2" marker-end="url(#g)"/>
<text x="832" y="957" class="al" style="fill:#3fb950;font-weight:600">valid PASS</text>
<!-- row D -->
<rect x="80" y="830" width="400" height="90" rx="10" fill="#2a1218" stroke="#ff6b6b" stroke-width="1.5"/><rect x="80" y="830" width="6" height="90" rx="3" fill="#ff6b6b"/>
<text x="102" y="860" class="bt">6 · Defect report</text><text x="460" y="860" class="who" text-anchor="end" fill="#a78bfa">VERIFIER</text>
<text x="102" y="884" class="bs">every problem, the spec line it breaks,</text>
<text x="102" y="906" class="bs">how to reproduce: goes to the Implementer</text>
<path d="M140,830 L140,792" fill="none" stroke="#ff6b6b" stroke-width="2" marker-end="url(#r)"/>
<!-- stop the line -->
<rect x="1060" y="830" width="310" height="90" rx="10" fill="#2a1218" stroke="#ff6b6b" stroke-width="2.5"/><rect x="1060" y="830" width="6" height="90" rx="3" fill="#ff6b6b"/>
<text x="1082" y="860" class="bt">Stage blocked, run ends</text>
<text x="1082" y="884" class="bs">later stages are not started;</text>
<text x="1082" y="906" class="bs">accepted stages stand; final report</text>
<!-- accepted -->
<rect x="620" y="964" width="400" height="80" rx="10" fill="#0f2419" stroke="#3fb950" stroke-width="2.5"/><rect x="620" y="964" width="6" height="80" rx="3" fill="#3fb950"/>
<text x="642" y="993" class="bt">Stage accepted</text>
<text x="642" y="1018" class="bs">the next stage starts at 1; after the last, a final report</text>
</svg>
