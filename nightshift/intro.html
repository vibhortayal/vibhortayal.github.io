<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshift Factory: video intro</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Archivo:wdth,wght@87.5..100,400..600&display=swap" rel="stylesheet">
<style>
/* Presenter version of the landing page's first screen, for recording the video intro.
   Click a team member in the picture, or a name underneath, to highlight them; click the
   same one again to clear. Keys: 1-4 pick a speaker, Space or right arrow steps through
   them, 0 or Esc clears, C hides or shows the caption. A speaker can also be set in the
   address: intro.html#2 */
:root{
  --night:#020716;
  --sodium:#FFB81C;
  --chalk:#EEF1F4;
  --dust:#8A97AB;
  --rule:#1B2740;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --text:"Archivo","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--night);color:var(--chalk);font-family:var(--text);font-size:18px;line-height:1.5}
body{margin:0;overflow:hidden}
img{display:block;max-width:100%;height:auto}
.page{width:min(1560px,calc(100% - 8vw));margin:0 auto}

.board{height:100vh;display:flex;flex-direction:column;justify-content:flex-start;gap:1.6vh;padding:3vh 0 0}
.slug{display:flex;justify-content:space-between;gap:24px;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dust);
  border-top:3px solid var(--sodium);padding-top:14px}
.title{margin:.6vh 0 0;font-family:var(--display);font-weight:900;text-transform:uppercase;white-space:nowrap;
  font-size:clamp(2.6rem,7vw,8rem);line-height:.86;letter-spacing:-.012em}
.title .a{color:var(--sodium)}
.title .b{color:var(--chalk)}

/* ---------- the crew: base artwork, plus one lit copy clipped to the speaker ---------- */
.crew{position:relative;margin:0;cursor:pointer;
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 3%,#000 97%,transparent 100%);
  mask-image:linear-gradient(to right,transparent 0,#000 3%,#000 97%,transparent 100%)}
.crew img{width:100%;height:auto}
.crew .base{transition:filter .45s ease}
.crew.on .base{filter:brightness(.3) saturate(.55)}
.crew .lit{position:absolute;inset:0;opacity:0;pointer-events:none;
  -webkit-mask-image:linear-gradient(to right,transparent calc(var(--l) - 2.5%),#000 calc(var(--l) + 3.5%),#000 calc(var(--r) - 3.5%),transparent calc(var(--r) + 2.5%));
  mask-image:linear-gradient(to right,transparent calc(var(--l) - 2.5%),#000 calc(var(--l) + 3.5%),#000 calc(var(--r) - 3.5%),transparent calc(var(--r) + 2.5%));
  transition:opacity .35s ease}
.crew.on .lit{opacity:1}

.roster{display:grid;grid-template-columns:repeat(4,1fr);margin:0;padding:0;list-style:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.roster li{cursor:pointer;padding:12px 20px 12px 0;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:baseline;transition:opacity .35s ease}
.roster li + li{border-left:1px solid var(--rule);padding-left:20px}
.roster .no{color:var(--dust);font-variant-numeric:tabular-nums;font-size:.82rem}
.roster .name{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:2rem;line-height:1;letter-spacing:.01em}
.roster .role{grid-column:2;color:var(--chalk);font-size:.95rem;margin-top:4px}
.roster .kind{grid-column:2;color:var(--dust);font-size:.8rem}
.roster.on li{opacity:.3}
.roster.on li.now{opacity:1}
.roster li.now .name{color:var(--sodium)}

/* ---------- closed caption ---------- */
.cc{position:fixed;left:50%;bottom:3.2vh;transform:translateX(-50%);width:min(1240px,calc(100% - 10vw));
  display:grid;grid-template-columns:auto 1fr;column-gap:22px;align-items:start;
  background:rgba(2,7,22,.92);border:1px solid var(--rule);border-left:5px solid var(--sodium);
  padding:16px 24px 18px;opacity:0;transition:opacity .3s ease}
.cc.show{opacity:1}
.cc .who{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:1.9rem;line-height:1;color:var(--sodium);letter-spacing:.02em}
.cc .who small{display:block;margin-top:6px;font-family:var(--text);font-weight:500;font-size:.72rem;letter-spacing:.14em;color:var(--dust)}
.cc .says{margin:0;font-size:clamp(1.05rem,1.55vw,1.45rem);line-height:1.35;font-weight:500;font-stretch:87.5%}
</style>
</head>
<body>
<div class="page">
  <header class="board">
    <div>
      <div class="slug"><span>Team Nightshift</span><span>Band Dark Factory hackathon, October 2026</span></div>
      <h1 class="title"><span class="a">Nightshift</span> <span class="b">Factory</span></h1>
    </div>

    <figure class="crew" id="crew">
      <img class="base" src="assets/team.jpg" width="2137" height="736" alt="Illustration of Team Nightshift, left to right: Vibhor, Spark, Instinct and Claude.">
      <img class="lit" src="assets/team.jpg" width="2137" height="736" alt="">
    </figure>

    <ol class="roster" id="roster" aria-label="On shift">
      <li><span class="no">01</span><span class="name">Vibhor</span><span class="role">Founder and product owner</span><span class="kind">human</span></li>
      <li><span class="no">02</span><span class="name">Spark</span><span class="role">Program manager</span><span class="kind">AI agent</span></li>
      <li><span class="no">03</span><span class="name">Instinct</span><span class="role">QA and release manager</span><span class="kind">AI agent</span></li>
      <li><span class="no">04</span><span class="name">Claude</span><span class="role">Platform engineer</span><span class="kind">AI agent</span></li>
    </ol>
  </header>
</div>

<div class="cc" id="cc" role="status" aria-live="polite">
  <div class="who" id="who"></div>
  <p class="says" id="says"></p>
</div>

<script>
// One entry per speaker. l and r are the left and right edges of the character in the
// artwork, in % of its width. Change a name or a line here; nothing else needs editing.
const SPEAKERS = [
  {name:"Vibhor", role:"Founder and product owner", l:0, r:30.5,
   says:"Hi, I'm Vibhor. Our team is me and three AI agents, and I'm the only human in the loop."},
  {name:"Spark", role:"Program manager", l:29.5, r:51.5,
   says:"Hi, I'm Spark. I'm the program manager. I coordinate the team, watch the rooms, and keep the runs and the milestones honest."},
  {name:"Instinct", role:"QA and release manager", l:49.5, r:69.5,
   says:"Hi, I'm Instinct. I'm the QA and release manager. I double-check everyone's work, signing off or pushing back."},
  {name:"Claude", role:"Platform engineer", l:68, r:94,
   says:"Hi, I'm Claude. I'm the platform engineer. I do the hands-on platform work, but Vibhor decides what we're building, what done means, and when we run. Nothing goes out until he approves it and Spark and Instinct have checked it."},
];

const crew = document.getElementById("crew");
const roster = document.getElementById("roster");
const cc = document.getElementById("cc");
const who = document.getElementById("who");
const says = document.getElementById("says");
let current = 0;        // 0 means nobody is speaking
let captions = true;

function speak(n){
  current = (n >= 1 && n <= SPEAKERS.length) ? n : 0;
  const on = current > 0;
  crew.classList.toggle("on", on);
  roster.classList.toggle("on", on);
  [...roster.children].forEach((li, i) => li.classList.toggle("now", i === current - 1));
  if (on){
    const s = SPEAKERS[current - 1];
    crew.style.setProperty("--l", s.l + "%");
    crew.style.setProperty("--r", s.r + "%");
    who.innerHTML = "";
    who.append(s.name);
    const small = document.createElement("small");
    small.textContent = s.role;
    who.append(small);
    says.textContent = s.says;
  }
  cc.classList.toggle("show", on && captions);
}

// A click picks the member under the pointer; a click on the one already lit clears it.
const pick = n => speak(n === current ? 0 : n);
crew.addEventListener("click", e => {
  const box = crew.getBoundingClientRect();
  const x = (e.clientX - box.left) / box.width * 100;
  // neighbours overlap a little in the artwork, so split each overlap down the middle
  const edges = SPEAKERS.map((s, i) => i === 0 ? s.l : (s.l + SPEAKERS[i - 1].r) / 2);
  let n = 0;
  edges.forEach((edge, i) => { if (x >= edge && x <= SPEAKERS[SPEAKERS.length - 1].r) n = i + 1; });
  if (n) pick(n); else speak(0);
});
[...roster.children].forEach((li, i) => li.addEventListener("click", () => pick(i + 1)));

document.addEventListener("keydown", e => {
  if (e.key >= "1" && e.key <= "4") speak(Number(e.key));
  else if (e.key === "0" || e.key === "Escape") speak(0);
  else if (e.key === " " || e.key === "ArrowRight"){ e.preventDefault(); speak(current >= SPEAKERS.length ? 0 : current + 1); }
  else if (e.key === "ArrowLeft") speak(current - 1);
  else if (e.key.toLowerCase() === "c"){ captions = !captions; speak(current); }
});

speak(Number(location.hash.slice(1)) || 0);
</script>
</body>
</html>
